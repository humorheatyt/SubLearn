name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Verify and build release APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Reconstruct release keystore
        env:
          SUBLEARN_KEYSTORE_BASE64: ${{ secrets.SUBLEARN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SUBLEARN_KEYSTORE_BASE64" ]; then
            printf '%s' "$SUBLEARN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sublearn-release.jks"
            echo "SUBLEARN_KEYSTORE_FILE=$RUNNER_TEMP/sublearn-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SUBLEARN_KEYSTORE_BASE64 secret is missing; APKs will be staged unsigned for out-of-band signing."
          fi
      - name: Build, test and lint
        env:
          SUBLEARN_KEYSTORE_PASSWORD: ${{ secrets.SUBLEARN_KEYSTORE_PASSWORD }}
          SUBLEARN_KEY_ALIAS: ${{ secrets.SUBLEARN_KEY_ALIAS }}
          SUBLEARN_KEY_PASSWORD: ${{ secrets.SUBLEARN_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon -PsublearnReleaseSplits \
            assembleRelease testDebugUnitTest \
            :core:domain:test :core:subtitles:test \
            lint
      - name: Collect APKs and checksums
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out="$RUNNER_TEMP/release-assets"
          mkdir -p "$out"
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            src=""
            for candidate in "app/build/outputs/apk/release/app-${abi}-release.apk" "app/build/outputs/apk/release/app-${abi}-release-unsigned.apk"; do
              if [ -f "$candidate" ]; then src="$candidate"; break; fi
            done
            if [ -z "$src" ]; then
              echo "::error::Missing expected APK for ABI ${abi}"
              ls -R app/build/outputs/apk/release || true
              exit 1
            fi
            cp "$src" "$out/SubLearn-${version}-${abi}.apk"
          done
          (cd "$out" && sha256sum SubLearn-*.apk > SHA256SUMS.txt)
          echo "SUBLEARN_RELEASE_ASSETS=$out" >> "$GITHUB_ENV"
      - name: Publish release directly (signed in CI)
        if: ${{ env.SUBLEARN_KEYSTORE_FILE != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$SUBLEARN_RELEASE_ASSETS"/* \
            --title "SubLearn $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
      - name: Stage unsigned APKs for out-of-band signing
        if: ${{ env.SUBLEARN_KEYSTORE_FILE == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          staging_branch="release-staging/${GITHUB_REF_NAME}"
          work="$RUNNER_TEMP/staging"
          mkdir -p "$work/unsigned"
          cp "$SUBLEARN_RELEASE_ASSETS"/*.apk "$work/unsigned/"
          cp "$SUBLEARN_RELEASE_ASSETS"/SHA256SUMS.txt "$work/unsigned/"
          cat > "$work/MANIFEST.txt" <<EOF
          tag=${GITHUB_REF_NAME}
          commit=${GITHUB_SHA}
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          signed=no
          EOF
          cd "$work"
          git init -q -b "$staging_branch"
          git config user.name "SubLearn release bot"
          git config user.email "release-bot@sublearn.local"
          git add -A
          git commit -q -m "release: stage unsigned APKs for ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${staging_branch}"
          echo "::notice::Unsigned APKs staged on branch ${staging_branch}. Sign them with the SubLearn release key and push a signed/ directory to trigger publish-release."
